[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aws-infra-ops-mcp"
version = "0.1.0"
description = "A local, read-only AWS infrastructure troubleshooting MCP server."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34,<2",
    "mcp>=1.28,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
aws-infra-ops-mcp = "aws_infra_ops_mcp.app:main"

[tool.hatch.build.targets.wheel]
packages = ["aws_infra_ops_mcp"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
